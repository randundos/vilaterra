<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vilaterra — Encuentro con Mac Arrons</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', sans-serif;
    overflow: hidden;
  }
  h1 { color: #eee; margin: 10px 0 2px; font-size: 20px; }
  p.hint { color: #bbb; margin: 0 0 10px; font-size: 14px; text-align: center; }
  #wrap {
    position: relative;
    border: 4px solid #000;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #222;
  }
</style>
</head>
<body>
  <h1>Vilaterra — Nivel 1</h1>
  <p class="hint">
    <b>A</b> / <b>D</b> para moverte &nbsp;·&nbsp; <b>Espacio</b> para saltar &nbsp;·&nbsp; <b>doble Espacio</b> rápido para empujón
  </p>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- Carga de assets (rutas relativas a la carpeta Visuals) ---
const assets = {
  bg: new Image(),
  player: new Image(),
  mac: new Image()
};
assets.bg.src = 'Visuals/fondo%20lvl1.png';
assets.player.src = 'Visuals/Blai_sinfondo.png';
assets.mac.src = 'Visuals/Mac%20Arrons_sinfondo.png';

let loaded = 0;
const total = 3;
function onLoad() {
  loaded++;
  if (loaded === total) requestAnimationFrame(loop);
}
Object.values(assets).forEach(img => {
  img.onload = onLoad;
  img.onerror = () => console.error('No se pudo cargar la imagen:', img.src);
});

// --- Estado del juego ---
const groundY = canvas.height * 0.80;

const player = {
  x: 200,
  height: 155,
  hipFraction: 0.58,
  facing: 'right',   // 'right' | 'left'
  vy: 0,             // velocidad vertical (salto)
  jumpOffset: 0,      // 0 = en el suelo, negativo = en el aire
  grounded: true,
  dashVX: 0           // velocidad horizontal extra del empujón
};

const mac = {
  x: canvas.width - 190,
  height: 195,
  hipFraction: 0.62
};

const GRAVITY = 0.6;
const JUMP_VELOCITY = -12;
const SPEED = 3.2;
const DASH_BURST = 10;
const DASH_DECAY = 0.90;
const DOUBLE_TAP_MS = 320;
const TALK_DISTANCE = 130;
const MIN_X = 60;
const MAX_X = canvas.width - 60;

const keys = { a: false, d: false };
let lastSpaceTime = -Infinity;
let bubbleScale = 0;
let isWalking = false;

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'a') keys.a = true;
  if (k === 'd') keys.d = true;

  if (k === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) {
      const now = performance.now();
      if (now - lastSpaceTime < DOUBLE_TAP_MS) {
        // doble espacio -> empujón hacia adelante en la dirección a la que mira
        player.dashVX = (player.facing === 'right' ? 1 : -1) * DASH_BURST;
        lastSpaceTime = -Infinity;
      } else {
        // espacio simple -> salto (solo si está en el suelo)
        if (player.grounded) {
          player.vy = JUMP_VELOCITY;
          player.grounded = false;
        }
        lastSpaceTime = now;
      }
    }
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'a') keys.a = false;
  if (k === 'd') keys.d = false;
});

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function getBox(img, centerX, groundYPos, height) {
  const ratio = img.width / img.height;
  const h = height;
  const w = h * ratio;
  const x = centerX - w / 2;
  const y = groundYPos - h;
  return { x, y, w, h };
}

// Dibuja el sprite con un ciclo de andar simulado: separa el cuerpo (torso+cabeza)
// de las piernas, y gira cada pierna (mitad izquierda/derecha) alrededor de la cadera
// como un compás, ya que solo tenemos una pose estática de cada personaje.
function drawWalking(img, box, hipFraction, t, walking, idleBreath = true) {
  const { x, y, w, h } = box;
  const hipY = y + h * hipFraction;
  const bodyH = hipY - y;
  const legH = (y + h) - hipY;

  const bob = walking ? Math.sin(t * 0.018) * 3 : (idleBreath ? Math.sin(t * 0.0025) * 1.5 : 0);

  ctx.save();

  // --- torso + cabeza (con pequeño balanceo vertical) ---
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - 4, y - 4 + bob, w + 8, bodyH + 8);
  ctx.clip();
  ctx.drawImage(img, x, y + bob, w, h);
  ctx.restore();

  if (walking) {
    // --- piernas: dos mitades que giran en contrafase alrededor de la cadera ---
    const legAngle = Math.sin(t * 0.022) * 0.30;

    ctx.save();
    ctx.beginPath();
    ctx.rect(x - 4, hipY - 2, w / 2 + 4, legH + 12);
    ctx.clip();
    const pivotLX = x + w * 0.30;
    ctx.translate(pivotLX, hipY);
    ctx.rotate(legAngle);
    ctx.translate(-pivotLX, -hipY);
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.rect(x + w / 2 - 4, hipY - 2, w / 2 + 8, legH + 12);
    ctx.clip();
    const pivotRX = x + w * 0.70;
    ctx.translate(pivotRX, hipY);
    ctx.rotate(-legAngle);
    ctx.translate(-pivotRX, -hipY);
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - 4, hipY - 2, w + 8, legH + 12);
    ctx.clip();
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
  }

  ctx.restore();
}

function drawSpeechBubble(x, y, text, scale) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  ctx.font = 'bold 20px Trebuchet MS';
  const paddingX = 18, paddingY = 12;
  const textWidth = ctx.measureText(text).width;
  const boxW = textWidth + paddingX * 2;
  const boxH = 40 + paddingY;
  const bx = -boxW / 2;
  const by = -boxH - 20;

  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(bx, by, boxW, boxH, 12);
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-10, by + boxH);
  ctx.lineTo(10, by + boxH);
  ctx.lineTo(-4, by + boxH + 16);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, by + boxH / 2 + 2);

  ctx.restore();
}

function update() {
  // --- movimiento horizontal (A / D) ---
  let moveX = 0;
  if (keys.d) { moveX += SPEED; player.facing = 'right'; }
  if (keys.a) { moveX -= SPEED; player.facing = 'left'; }

  player.x += moveX + player.dashVX;
  if (player.dashVX !== 0) {
    player.dashVX *= DASH_DECAY;
    if (Math.abs(player.dashVX) < 0.3) player.dashVX = 0;
  }
  player.x = clamp(player.x, MIN_X, MAX_X);

  // --- salto (gravedad simple) ---
  player.vy += GRAVITY;
  player.jumpOffset += player.vy;
  if (player.jumpOffset >= 0) {
    player.jumpOffset = 0;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  isWalking = player.grounded && moveX !== 0;

  // --- burbuja de diálogo según cercanía (aparece/desaparece, no bloquea) ---
  const distance = Math.abs(mac.x - player.x);
  const near = distance <= TALK_DISTANCE;
  bubbleScale += ((near ? 1 : 0) - bubbleScale) * 0.15;
}

function draw(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // fondo
  ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);

  // Mac Arrons (fijo, con pequeña respiración idle)
  const macBox = getBox(assets.mac, mac.x, groundY, mac.height);
  drawWalking(assets.mac, macBox, mac.hipFraction, t, false, true);

  // protagonista (con salto y giro según dirección)
  const playerGroundY = groundY + player.jumpOffset;
  const playerBox = getBox(assets.player, player.x, playerGroundY, player.height);

  ctx.save();
  if (player.facing === 'left') {
    const centerX = playerBox.x + playerBox.w / 2;
    ctx.translate(centerX, 0);
    ctx.scale(-1, 1);
    ctx.translate(-centerX, 0);
  }
  drawWalking(assets.player, playerBox, player.hipFraction, t, isWalking, true);
  ctx.restore();

  // burbuja de diálogo de Mac Arrons
  drawSpeechBubble(macBox.x + macBox.w / 2, macBox.y, 'Ei bro, que dius?', bubbleScale);
}

function loop(t) {
  update();
  draw(t || 0);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
